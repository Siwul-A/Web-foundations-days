<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live character counter and dark mode</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>QuickNotes Draft</h1>
      <button id="theme-toggle" class="btn">Dark Mode</button>
    </header>

    <div class="editor-section">
      <label for="note-text">write your notes below:</label>
      <textarea name="" id="note-text" placeholder="type something here..."></textarea>
      <div class="counters">
       <p id="char-count">0/200 characters</p>
       <p id="word-count">0 words</p>
      </div>
      <button id="clear-btn" class="btn danger-btn">Clear</button>
    </div>
  </main>
</body>
</html>
